<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Card</title>
    <!-- Google Font-->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="balloons">
      <div class="balloon b1"></div>
      <div class="balloon b2"></div>
      <div class="balloon b3"></div>
    </div>
    <div class="card">
      <div class="outside">
        <div class="front">
          <p>Happy Birthday</p>
          <div class="cake">
            <div class="top-layer"></div>
            <div class="middle-layer"></div>
            <div class="bottom-layer"></div>
            <div class="candle"></div>
          </div>
        </div>
        <div class="back"></div>
      </div>
      <div class="inside">
        <p>
          Liebste Ana, i wünsch dir einen sehr schönen Geburtstag und hoffe, du
          hast an tollen Tag überhaupt und hab di lieb
        </p>
        <div class="photos">
          <img src="8b08bca5-b8fe-4919-be7c-f2294610a0be.JPG" alt="Ana 1" />
          <img src="df3d58b8-3f0c-4f20-b0bf-aa3de688a51e.JPG" alt="Ana 2" />
          <img src="975fcb33-f17d-4f96-9d90-067066a1efbc.JPG" alt="Ana 3" />
          <img src="75df45f9-9a35-48d2-950c-9c0b4bbf1e34.JPG" alt="Ana 4" />
        </div>
        <h1>&#127873;</h1>
      </div>
    </div>
  </body>
</html>
